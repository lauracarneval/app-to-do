<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do Calendário & Bichinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ======================================================
     VARIÁVEIS DE COR — paleta "céu + pelúcia"
     ====================================================== */
  :root {
    --sky-top: #bfe9ff;
    --sky-bottom: #eef9ff;
    --cream: #fff8ec;
    --cream-dark: #ecdfc4;
    --caramel: #e7b47b;
    --caramel-dark: #c98a4c;
    --mint: #c3f2e0;
    --mint-dark: #8fdcb9;
    --pink: #ffd6e8;
    --pink-dark: #ff9fc7;
    --orange: #ff9a4d;
    --orange-dark: #f0791f;
    --text: #6b5344;
    --text-light: #a68a72;
    --panel-shadow: 0 14px 0 rgba(150, 115, 80, 0.10), 0 18px 34px rgba(120, 90, 60, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%);
    overflow-x: hidden;
    position: relative;
  }

  /* ======================================================
     NUVENS DE FUNDO — divs simples com feito "algodão"
     ====================================================== */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 999px;
    opacity: 0.85;
    filter: blur(0.2px);
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 999px;
  }
  .cloud.c1 { width: 140px; height: 50px; top: 8%; left: -20%; animation: driftRight 55s linear infinite; }
  .cloud.c1::before { width: 70px; height: 70px; top: -35px; left: 15px; }
  .cloud.c1::after { width: 55px; height: 55px; top: -25px; left: 70px; }

  .cloud.c2 { width: 100px; height: 38px; top: 20%; left: -25%; animation: driftRight 40s linear infinite; animation-delay: -12s; }
  .cloud.c2::before { width: 50px; height: 50px; top: -24px; left: 10px; }
  .cloud.c2::after { width: 40px; height: 40px; top: -18px; left: 50px; }

  .cloud.c3 { width: 170px; height: 55px; top: 4%; left: -30%; animation: driftRight 70s linear infinite; animation-delay: -30s; }
  .cloud.c3::before { width: 80px; height: 80px; top: -40px; left: 20px; }
  .cloud.c3::after { width: 60px; height: 60px; top: -28px; left: 90px; }

  .cloud.c4 { width: 90px; height: 34px; top: 13%; left: -20%; animation: driftRight 48s linear infinite; animation-delay: -22s; }
  .cloud.c4::before { width: 44px; height: 44px; top: -20px; left: 8px; }
  .cloud.c4::after { width: 34px; height: 34px; top: -14px; left: 44px; }

  @keyframes driftRight {
    from { transform: translateX(0); }
    to { transform: translateX(160vw); }
  }

  /* ======================================================
     LAYOUT GERAL
     ====================================================== */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 22px;
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px;
    min-height: 100vh;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .panel {
    background: var(--cream);
    border-radius: 30px;
    box-shadow: var(--panel-shadow);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  /* textura sutil de feltro: pontinhos bem discretos */
  .panel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(150,115,80,0.06) 1px, transparent 1.4px);
    background-size: 10px 10px;
    opacity: 0.6;
  }
  .panel > * { position: relative; z-index: 1; }

  h1, h2 {
    font-family: 'Baloo 2', sans-serif;
    color: var(--text);
    text-shadow: 0 2px 0 rgba(255,255,255,0.7);
    margin: 0 0 18px 0;
  }

  h1 { font-size: 1.6rem; }
  h2 { font-size: 1.25rem; text-align: center; }

  /* ======================================================
     CALENDÁRIO
     ====================================================== */
  .calendar-panel { flex: 1.1; min-width: 340px; }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .month-label {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    text-transform: capitalize;
  }

  .toy-btn {
    border: none;
    cursor: pointer;
    font-family: 'Baloo 2', sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #fff, var(--pink));
    box-shadow: 0 4px 0 var(--pink-dark), 0 6px 10px rgba(120,90,60,0.18);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .toy-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--pink-dark), 0 2px 4px rgba(120,90,60,0.18);
  }

  .nav-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.1rem;
  }

  .today-btn {
    border-radius: 16px;
    padding: 7px 16px;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .today-row { display: flex; justify-content: center; margin-bottom: 14px; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-light);
    font-weight: 700;
    margin-bottom: 10px;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 9px;
  }

  .day-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    background: linear-gradient(180deg, #ffffff, var(--cream-dark));
    box-shadow: 0 4px 0 #d8c8a8, 0 6px 10px rgba(120,90,60,0.15);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .day-cell:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #d8c8a8, 0 2px 4px rgba(120,90,60,0.15);
  }

  .day-cell.other-month {
    background: transparent;
    box-shadow: none;
    color: #cdbfd6;
    cursor: pointer;
  }

  .day-cell.today {
    outline: 3px solid var(--orange);
    outline-offset: 2px;
  }

  .day-cell.selected {
    background: linear-gradient(180deg, #fff, var(--pink));
    box-shadow: 0 4px 0 var(--pink-dark), 0 6px 10px rgba(120,90,60,0.18);
  }

  .day-cell.has-pending {
    background: linear-gradient(180deg, #fff, var(--orange));
    box-shadow: 0 4px 0 var(--orange-dark), 0 6px 10px rgba(120,90,60,0.18);
    color: #7a4a20;
  }

  .day-cell.all-done {
    background: linear-gradient(180deg, #fff, var(--mint));
    box-shadow: 0 4px 0 var(--mint-dark), 0 6px 10px rgba(120,90,60,0.18);
  }

  .marker {
    margin-top: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 18px;
    font-size: 0.78rem;
    color: var(--text-light);
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }

  /* ======================================================
     PAINEL DO DIA
     ====================================================== */
  .day-panel { flex: 1; min-width: 320px; display: flex; flex-direction: column; }

  .selected-date-label {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    text-transform: capitalize;
    margin-bottom: 2px;
    text-align: center;
  }

  .task-progress {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 16px;
    text-align: center;
    font-weight: 700;
  }

  .add-task-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .add-task-form input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 18px;
    border: 2px solid var(--cream-dark);
    background: #fffdf9;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    outline: none;
    color: var(--text);
    transition: border-color 0.15s;
  }
  .add-task-form input:focus { border-color: var(--orange); }

  .add-btn {
    width: 46px;
    border-radius: 18px;
    font-size: 1.3rem;
    background: linear-gradient(180deg, #fff, var(--orange));
    box-shadow: 0 4px 0 var(--orange-dark), 0 6px 10px rgba(120,90,60,0.18);
    color: #fff;
  }

  .task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    max-height: 340px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fffdf9;
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: 0 3px 0 var(--cream-dark);
    transition: background 0.15s;
  }

  .task-item.done {
    background: var(--mint);
    box-shadow: 0 3px 0 var(--mint-dark);
  }

  .task-item.bounce {
    animation: taskBounce 0.5s cubic-bezier(.36,1.7,.5,1) both;
  }
  @keyframes taskBounce {
    0% { transform: scale(1); }
    35% { transform: scale(1.08, 0.9); }
    60% { transform: scale(0.96, 1.06); }
    100% { transform: scale(1); }
  }

  .task-checkbox {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid var(--orange);
    background: white;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: white;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .task-checkbox:active { transform: scale(0.85); }

  .task-item.done .task-checkbox {
    background: var(--mint-dark);
    border-color: var(--mint-dark);
  }

  .task-text {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
    font-weight: 600;
  }

  .task-item.done .task-text {
    text-decoration: line-through;
    color: var(--text-light);
  }

  .delete-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text-light);
    padding: 6px 8px;
    border-radius: 10px;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .delete-btn:hover { background: var(--pink); color: #c94f7c; }

  .empty-state {
    text-align: center;
    color: var(--text-light);
    font-size: 0.9rem;
    margin-top: 24px;
    line-height: 1.7;
    font-weight: 600;
  }

  /* confete e carimbo de patinha, sobrepostos ao painel do dia */
  .celebration-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 30px;
    z-index: 5;
  }

  .confetti-piece {
    position: absolute;
    top: -20px;
    border-radius: 3px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(420px) rotate(360deg); opacity: 0; }
  }

  .paw-stamp {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: pawPop 1.6s ease-out forwards;
  }
  @keyframes pawPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    25% { transform: translate(-50%, -50%) scale(1.15) rotate(8deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
  }

  /* ======================================================
     PAINEL DO BICHINHO
     ====================================================== */
  .mascot-panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center; }

  .mascot-wrap {
    position: relative;
    width: 220px;
    height: 260px;
    cursor: pointer;
    user-select: none;
  }

  .mascot-wrap svg { width: 100%; height: 100%; overflow: visible; }

  #corpoRespira {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.035); }
  }

  /* reações ao clique */
  .mascot-wrap.anim-bounce #corpoRespira { animation: reactBounce 0.7s cubic-bezier(.36,1.6,.4,1) both; }
  @keyframes reactBounce {
    0% { transform: translateY(0) scale(1,1); }
    30% { transform: translateY(-16px) scale(0.95,1.08); }
    55% { transform: translateY(0) scale(1.08,0.9); }
    78% { transform: translateY(-5px) scale(0.98,1.03); }
    100% { transform: translateY(0) scale(1,1); }
  }

  .mascot-wrap.anim-wave #bracoDireito {
    transform-box: fill-box; transform-origin: top center;
    animation: reactWave 0.8s ease-in-out both;
  }
  @keyframes reactWave {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-30deg); }
    40% { transform: rotate(18deg); }
    60% { transform: rotate(-18deg); }
    80% { transform: rotate(8deg); }
  }

  .mascot-wrap.anim-fallback #corpoInteiro {
    transform-box: fill-box; transform-origin: bottom center;
    animation: reactFallback 0.85s ease-out both;
  }
  @keyframes reactFallback {
    0% { transform: rotate(0) translateY(0); }
    30% { transform: rotate(-18deg) translateY(6px); }
    55% { transform: rotate(-22deg) translateY(9px); }
    80% { transform: rotate(-4deg) translateY(1px); }
    100% { transform: rotate(0) translateY(0); }
  }

  .mascot-wrap.anim-yawn #cabecaGrupo {
    transform-box: fill-box; transform-origin: bottom center;
    animation: reactYawnHead 0.9s ease-in-out both;
  }
  .mascot-wrap.anim-yawn #bracoEsquerdo {
    transform-box: fill-box; transform-origin: top center;
    animation: reactYawnArmL 0.9s ease-in-out both;
  }
  .mascot-wrap.anim-yawn #bracoDireito {
    transform-box: fill-box; transform-origin: top center;
    animation: reactYawnArmR 0.9s ease-in-out both;
  }
  @keyframes reactYawnHead {
    0%, 100% { transform: rotate(0deg); }
    45% { transform: rotate(-8deg); }
  }
  @keyframes reactYawnArmL {
    0%, 100% { transform: rotate(0deg); }
    45% { transform: rotate(50deg); }
  }
  @keyframes reactYawnArmR {
    0%, 100% { transform: rotate(0deg); }
    45% { transform: rotate(-50deg); }
  }

  .mascot-wrap.anim-stretch #corpoInteiro {
    transform-box: fill-box; transform-origin: bottom center;
    animation: reactStretchBody 0.9s ease-in-out both;
  }
  .mascot-wrap.anim-stretch #bracoEsquerdo {
    transform-box: fill-box; transform-origin: top center;
    animation: reactStretchArmL 0.9s ease-in-out both;
  }
  .mascot-wrap.anim-stretch #bracoDireito {
    transform-box: fill-box; transform-origin: top center;
    animation: reactStretchArmR 0.9s ease-in-out both;
  }
  @keyframes reactStretchBody {
    0%, 100% { transform: scale(1,1); }
    40% { transform: scale(1.1, 0.85); }
    70% { transform: scale(0.92, 1.18); }
  }
  @keyframes reactStretchArmL {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(85deg); }
  }
  @keyframes reactStretchArmR {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-85deg); }
  }

  .mascot-wrap.anim-celebrate #corpoRespira {
    animation: reactCelebrate 1s cubic-bezier(.36,1.7,.4,1) both;
  }
  @keyframes reactCelebrate {
    0%, 100% { transform: translateY(0) scale(1,1); }
    20% { transform: translateY(-22px) scale(0.94,1.1); }
    40% { transform: translateY(0) scale(1.1,0.88); }
    60% { transform: translateY(-14px) scale(0.96,1.06); }
    80% { transform: translateY(0) scale(1.04,0.97); }
  }

  .heart-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .heart-pop {
    position: absolute;
    top: 10%;
    left: 50%;
    font-size: 1.6rem;
    transform: translateX(-50%);
    animation: heartFloat 1.4s ease-out forwards;
  }
  @keyframes heartFloat {
    0% { transform: translate(-50%, 0) scale(0.4); opacity: 0; }
    25% { transform: translate(-50%, -14px) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -55px) scale(1); opacity: 0; }
  }

  .points-row {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin-top: 10px;
    color: var(--orange-dark);
  }

  .progress-track {
    width: 100%;
    max-width: 240px;
    height: 16px;
    background: var(--cream-dark);
    border-radius: 999px;
    margin-top: 10px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(120,90,60,0.2);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), var(--pink-dark));
    border-radius: 999px;
    transition: width 0.4s ease-out;
  }

  .progress-hint {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-top: 6px;
    text-align: center;
    font-weight: 700;
  }

  .unlock-toast {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translate(-50%, -100%);
    background: linear-gradient(180deg, #fff, var(--pink));
    box-shadow: 0 4px 0 var(--pink-dark), 0 6px 10px rgba(120,90,60,0.2);
    border-radius: 16px;
    padding: 10px 16px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
  }
  .unlock-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .accessories-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
  }

  .acc-badge {
    width: 46px;
    height: 46px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #fff, var(--cream-dark));
    box-shadow: 0 3px 0 #cbb98f, 0 5px 8px rgba(120,90,60,0.15);
    transition: transform 0.08s;
    position: relative;
  }
  .acc-badge:active { transform: translateY(2px); }

  .acc-badge.locked {
    filter: grayscale(1) brightness(0.85);
    cursor: default;
    opacity: 0.55;
  }

  .acc-badge.equipped {
    background: linear-gradient(180deg, #fff, var(--mint));
    box-shadow: 0 3px 0 var(--mint-dark), 0 5px 8px rgba(120,90,60,0.15);
  }

  .acc-badge svg { width: 26px; height: 26px; }

  @media (max-width: 1050px) {
    .app { justify-content: center; }
  }
</style>
</head>
<body>

<div class="sky">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
</div>

<div class="app">

  <!-- ================= CALENDÁRIO ================= -->
  <div class="panel calendar-panel">
    <h1>🗓️ Meu Calendário</h1>
    <div class="cal-header">
      <button class="toy-btn nav-btn" id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="toy-btn nav-btn" id="nextMonth">›</button>
    </div>
    <div class="today-row">
      <button class="toy-btn today-btn" id="todayBtn">Hoje</button>
    </div>
    <div class="weekdays">
      <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>

    <div class="legend">
      <span id="legendPending"></span>
      <span id="legendDone"></span>
    </div>
  </div>

  <!-- ================= PAINEL DO DIA ================= -->
  <div class="panel day-panel" id="dayPanel">
    <div class="selected-date-label" id="selectedDateLabel"></div>
    <div class="task-progress" id="taskProgress"></div>

    <form class="add-task-form" id="addTaskForm">
      <input type="text" id="newTaskInput" placeholder="Nova tarefa..." maxlength="200" autocomplete="off">
      <button type="submit" class="toy-btn add-btn">+</button>
    </form>

    <ul class="task-list" id="taskList"></ul>
    <div class="empty-state" id="emptyState">✨ Nenhuma tarefa por aqui.<br>Adicione a primeira!</div>

    <div class="celebration-layer" id="celebrationLayer"></div>
  </div>

  <!-- ================= BICHINHO ================= -->
  <div class="panel mascot-panel">
    <h2>Seu bichinho</h2>
    <div class="mascot-wrap" id="mascotWrap">

        <g id="corpoInteiro">

          <g id="corpoRespira">

            <rect x="72" y="205" width="30" height="42" rx="15" fill="url(#furGrad)"/>

            <ellipse cx="87" cy="250" rx="18" ry="11" fill="#fff2df"/>

            <!-- patins -->
            <g id="acc-patins" style="display:none">
              <rect x="70" y="255" width="34" height="10" rx="5" fill="#b0b0b0"/>
              <circle cx="78" cy="267" r="5" fill="#7a7a7a"/>
              <circle cx="96" cy="267" r="5" fill="#7a7a7a"/>
              <rect x="116" y="255" width="34" height="10" rx="5" fill="#b0b0b0"/>
              <circle cx="124" cy="267" r="5" fill="#7a7a7a"/>
              <circle cx="142" cy="267" r="5" fill="#7a7a7a"/>
            </g>

            <!-- braço esquerdo -->
            <g id="bracoEsquerdo">
              <rect x="28" y="128" width="30" height="66" rx="15" fill="url(#furGrad)"/>

            <!-- corpo -->
            <rect x="55" y="112" width="110" height="112" rx="55" fill="url(#furGrad)"/>

            <!-- braço direito -->
            <g id="bracoDireito">

            <!-- cabeça -->
            <g id="cabecaGrupo">
              <circle cx="72" cy="46" r="24" fill="url(#furGrad)"/>

              <ellipse cx="110" cy="65" rx="56" ry="50" fill="url(#furGrad)"/>

              <!-- bochechas -->
              <ellipse cx="80" cy="88" rx="11" ry="7" fill="#ffb3c6" opacity="0.85"/>
              <ellipse cx="140" cy="88" rx="11" ry="7" fill="#ffb3c6" opacity="0.85"/>

              <!-- focinho -->
              <ellipse cx="110" cy="82" rx="24" ry="18" fill="#fff2df"/>
              <ellipse cx="110" cy="76" rx="5" ry="4" fill="#6b5344"/>

              <!-- olhos -->
              <circle cx="90" cy="62" r="7" fill="#3a2c22"/>
              <circle cx="130" cy="62" r="7" fill="#3a2c22"/>
              <circle cx="92.5" cy="59.5" r="2" fill="#ffffff"/>
              <circle cx="132.5" cy="59.5" r="2" fill="#ffffff"/>

              <!-- brilho clay -->
              <ellipse cx="88" cy="42" rx="26" ry="14" fill="#ffffff" opacity="0.3"/>

              <!-- óculos -->
              <g id="acc-oculos" style="display:none">
                <circle cx="90" cy="62" r="12" fill="none" stroke="#5a4636" stroke-width="3"/>
                <circle cx="130" cy="62" r="12" fill="none" stroke="#5a4636" stroke-width="3"/>
                <line x1="102" y1="62" x2="118" y2="62" stroke="#5a4636" stroke-width="3"/>
              </g>

              <!-- chapéu -->
              <g id="acc-chapeu" style="display:none">
                <ellipse cx="110" cy="26" rx="42" ry="16" fill="#c98a4c"/>
                <circle cx="110" cy="10" r="9" fill="#fff2df"/>
              </g>

              <!-- coroa -->
              <g id="acc-coroa" style="display:none">
                <polygon points="70,28 80,4 96,22 110,2 124,22 140,4 150,28" fill="#ffd34d" stroke="#e0a800" stroke-width="2"/>
                <circle cx="110" cy="16" r="3.5" fill="#ff7a59"/>
              </g>
            </g>
          </g>

          <!-- brilho geral do corpo -->
          <ellipse cx="90" cy="130" rx="28" ry="14" fill="#ffffff" opacity="0.25"/>
        </g>
      </svg>
      <div class="heart-layer" id="heartLayer"></div>
    </div>

    <div class="points-row">🌟 <span id="pointsLabel">0</span> pontos</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-hint" id="progressHint"></div>

    <div class="accessories-row" id="accessoriesRow"></div>
  </div>

</div>

<script>
/* ============================================================
   TO-DO CALENDÁRIO + BICHINHO DE PELÚCIA
   Toda a lógica de tarefas/calendário original foi mantida.
   Adições: pontos, acessórios e animações do bichinho.
   ============================================================ */
(function () {
  const STORAGE_KEY = 'todo-calendar-pet-v1';

  /* -------- lista de acessórios, na ordem de desbloqueio -------- */
  const ACCESSORIES = [
    { id: 'lencinho', label: 'Lencinho' },
    { id: 'chapeu',   label: 'Chapéu' },
    { id: 'oculos',   label: 'Óculos' },
    { id: 'mochila',  label: 'Mochila' },
    { id: 'coroa',    label: 'Coroa' },
    { id: 'asinhas',  label: 'Asinhas' },
    { id: 'patins',   label: 'Patins' },
    { id: 'capa',     label: 'Capa' }
  ];
  const PONTOS_POR_ACESSORIO = 10;

  /* pequenos ícones para os selos de acessório (independentes do bichinho) */
  const ACC_ICON_SVG = {
    lencinho: '<svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="6" rx="3" fill="#ff7a59"/><path d="M10 15 L14 15 L12 21 Z" fill="#ff7a59"/></svg>',
    chapeu:   '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="10" ry="3.2" fill="#c98a4c"/><path d="M6 16 Q12 2 18 16 Z" fill="#e0a869"/><circle cx="12" cy="3" r="2" fill="#fff2df"/></svg>',
    oculos:   '<svg viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="5" fill="none" stroke="#5a4636" stroke-width="2.4"/><circle cx="16.5" cy="12" r="5" fill="none" stroke="#5a4636" stroke-width="2.4"/><line x1="12.5" y1="12" x2="11.5" y2="12" stroke="#5a4636" stroke-width="2.4"/></svg>',
    mochila:  '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="15" rx="4" fill="#8fdcb9" stroke="#6cc79e" stroke-width="1.6"/><rect x="9" y="2" width="6" height="6" rx="2" fill="#6cc79e"/></svg>',
    coroa:    '<svg viewBox="0 0 24 24"><polygon points="3,18 5,7 9,13 12,4 15,13 19,7 21,18" fill="#ffd34d" stroke="#e0a800" stroke-width="1.4"/></svg>',
    asinhas:  '<svg viewBox="0 0 24 24"><path d="M12 12 Q2 8 4 18 Q9 17 12 12 Z" fill="#ffffff" stroke="#e7c9d6" stroke-width="1.4"/><path d="M12 12 Q22 8 20 18 Q15 17 12 12 Z" fill="#ffffff" stroke="#e7c9d6" stroke-width="1.4"/></svg>',
    patins:   '<svg viewBox="0 0 24 24"><rect x="3" y="12" width="8" height="4" rx="2" fill="#b0b0b0"/><circle cx="5.5" cy="18" r="2" fill="#7a7a7a"/><circle cx="10.5" cy="18" r="2" fill="#7a7a7a"/><rect x="13" y="12" width="8" height="4" rx="2" fill="#b0b0b0"/><circle cx="15.5" cy="18" r="2" fill="#7a7a7a"/><circle cx="20.5" cy="18" r="2" fill="#7a7a7a"/></svg>',
    capa:     '<svg viewBox="0 0 24 24"><path d="M6 4 L12 20 L18 4 Q12 8 6 4 Z" fill="#ff8fae"/></svg>'
  };

  /* -------- ícones simples usados no calendário (SVG, sem imagens) -------- */
  function svgDotPendente() {
    return '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#f0791f"/></svg>';
  }
  function svgPatinha(size) {
    size = size || 12;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24">' +
      '<ellipse cx="12" cy="16" rx="7" ry="6" fill="#c98a4c"/>' +
      '<circle cx="5" cy="8" r="3" fill="#c98a4c"/>' +
      '<circle cx="11" cy="5" r="3" fill="#c98a4c"/>' +
      '<circle cx="17" cy="5" r="3" fill="#c98a4c"/>' +
      '<circle cx="21" cy="9" r="2.6" fill="#c98a4c"/>' +
      '</svg>';
  }

  /* ------------------------------------------------------------
     PERSISTÊNCIA — tarefas, pontos e acessórios num único objeto
     ------------------------------------------------------------ */
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        tasks: parsed.tasks || {},
        points: typeof parsed.points === 'number' ? parsed.points : 0,
        bonusGiven: parsed.bonusGiven || {},
        equipped: parsed.equipped || {}
      };
    } catch (e) {
      return { tasks: {}, points: 0, bonusGiven: {}, equipped: {} };
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let data = loadData();

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = formatDate(today);

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function parseDate(str) {
    const parts = str.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  const monthNames = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const weekdayNamesFull = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

  const monthLabel = document.getElementById('monthLabel');
  const daysGrid = document.getElementById('daysGrid');
  const prevMonthBtn = document.getElementById('prevMonth');
  const nextMonthBtn = document.getElementById('nextMonth');
  const todayBtn = document.getElementById('todayBtn');

  const selectedDateLabel = document.getElementById('selectedDateLabel');
  const taskProgress = document.getElementById('taskProgress');
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');
  const addTaskForm = document.getElementById('addTaskForm');
  const newTaskInput = document.getElementById('newTaskInput');
  const dayPanel = document.getElementById('dayPanel');
  const celebrationLayer = document.getElementById('celebrationLayer');

  document.getElementById('legendPending').innerHTML = svgDotPendente() + ' tarefas pendentes';
  document.getElementById('legendDone').innerHTML = svgPatinha(14) + ' dia concluído';

  /* ------------------------------------------------------------
     CALENDÁRIO
     ------------------------------------------------------------ */
  function dayStatus(dateStr) {
    const tasks = data.tasks[dateStr];
    if (!tasks || tasks.length === 0) return 'none';
    return tasks.every(function (t) { return t.done; }) ? 'all-done' : 'has-pending';
  }

  function renderCalendar() {
    monthLabel.textContent = monthNames[viewMonth] + ' de ' + viewYear;
    daysGrid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day-cell';

      let cellDate, dayNum, isOtherMonth = false;

      if (i < startWeekday) {
        dayNum = daysInPrevMonth - startWeekday + i + 1;
        cellDate = new Date(viewYear, viewMonth - 1, dayNum);
        isOtherMonth = true;
      } else if (i >= startWeekday + daysInMonth) {
        dayNum = i - startWeekday - daysInMonth + 1;
        cellDate = new Date(viewYear, viewMonth + 1, dayNum);
        isOtherMonth = true;
      } else {
        dayNum = i - startWeekday + 1;
        cellDate = new Date(viewYear, viewMonth, dayNum);
      }

      const dateStr = formatDate(cellDate);

      const numSpan = document.createElement('span');
      numSpan.textContent = dayNum;
      cell.appendChild(numSpan);

      if (isOtherMonth) {
        cell.classList.add('other-month');
      } else {
        const status = dayStatus(dateStr);
        if (status === 'has-pending') cell.classList.add('has-pending');
        if (status === 'all-done') cell.classList.add('all-done');

        if (status !== 'none') {
          const marker = document.createElement('span');
          marker.className = 'marker';
          marker.innerHTML = status === 'has-pending' ? svgDotPendente() : svgPatinha(14);
          cell.appendChild(marker);
        }
      }

      const cellTime = new Date(cellDate);
      cellTime.setHours(0, 0, 0, 0);
      if (cellTime.getTime() === today.getTime()) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');

      cell.addEventListener('click', function () {
        if (isOtherMonth) {
          viewYear = cellDate.getFullYear();
          viewMonth = cellDate.getMonth();
        }
        selectedDate = dateStr;
        renderCalendar();
        renderTasks();
      });

      daysGrid.appendChild(cell);
    }
  }

  /* ------------------------------------------------------------
     PAINEL DE TAREFAS DO DIA
     ------------------------------------------------------------ */
  function renderTasks() {
    const d = parseDate(selectedDate);
    const weekday = weekdayNamesFull[d.getDay()];
    selectedDateLabel.textContent = weekday + ', ' + d.getDate() + ' de ' + monthNames[d.getMonth()] + ' de ' + d.getFullYear();

    const tasks = data.tasks[selectedDate] || [];
    const doneCount = tasks.filter(function (t) { return t.done; }).length;

    taskProgress.textContent = tasks.length === 0 ? '' : (doneCount + ' de ' + tasks.length + ' concluídas');

    taskList.innerHTML = '';

    if (tasks.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      tasks.forEach(function (task) {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('button');
        checkbox.type = 'button';
        checkbox.className = 'task-checkbox';
        checkbox.textContent = task.done ? '✓' : '';
        checkbox.addEventListener('click', function () { toggleTask(task.id); });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', function () { deleteTask(task.id); });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(delBtn);
        taskList.appendChild(li);
      });
    }
  }

  function addTask(text) {
    if (!data.tasks[selectedDate]) data.tasks[selectedDate] = [];
    data.tasks[selectedDate].push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text: text,
      done: false
    });
    saveData();
    renderCalendar();
    renderTasks();
  }

  function toggleTask(id) {
    const tasks = data.tasks[selectedDate];
    if (!tasks) return;
    const task = tasks.find(function (t) { return t.id === id; });
    if (!task) return;

    const wasAllDoneBefore = tasks.length > 0 && tasks.every(function (t) { return t.done; });
    task.done = !task.done;

    if (task.done) {
      addPoints(1);
    } else {
      addPoints(-1);
    }

    const isAllDoneNow = tasks.length > 0 && tasks.every(function (t) { return t.done; });

    saveData();
    renderCalendar();
    renderTasks();

    /* animação elástica no item marcado */
    requestAnimationFrame(function () {
      const items = taskList.querySelectorAll('.task-item');
      const idx = tasks.findIndex(function (t) { return t.id === id; });
      if (items[idx]) {
        items[idx].classList.add('bounce');
        items[idx].addEventListener('animationend', function () {
          items[idx].classList.remove('bounce');
        }, { once: true });
      }
    });

    /* comemoração ao completar o dia inteiro (sem punição se desmarcar depois) */
    if (isAllDoneNow && !wasAllDoneBefore && !data.bonusGiven[selectedDate]) {
      data.bonusGiven[selectedDate] = true;
      addPoints(5);
      saveData();
      celebrateDayComplete();
    }
  }

  function deleteTask(id) {
    const tasks = data.tasks[selectedDate];
    if (!tasks) return;
    const task = tasks.find(function (t) { return t.id === id; });
    if (task && task.done) addPoints(-1);

    data.tasks[selectedDate] = tasks.filter(function (t) { return t.id !== id; });
    if (data.tasks[selectedDate].length === 0) delete data.tasks[selectedDate];

    saveData();
    renderCalendar();
    renderTasks();
  }

  addTaskForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const text = newTaskInput.value.trim();
    if (!text) return;
    addTask(text);
    newTaskInput.value = '';
    newTaskInput.focus();
  });

  prevMonthBtn.addEventListener('click', function () {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });

  nextMonthBtn.addEventListener('click', function () {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  todayBtn.addEventListener('click', function () {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    selectedDate = formatDate(today);
    renderCalendar();
    renderTasks();
  });

  /* ------------------------------------------------------------
     COMEMORAÇÃO: confete + carimbo de patinha no painel do dia
     ------------------------------------------------------------ */
  function celebrateDayComplete() {
    spawnConfetti();
    spawnPawStamp();
    playMascotReaction('celebrate');
    spawnHeart();
  }

  function spawnConfetti() {
    const cores = ['#ff9a4d', '#ffd6e8', '#c3f2e0', '#ffd34d', '#ff8fae'];
    for (let i = 0; i < 26; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 6;
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = cores[Math.floor(Math.random() * cores.length)];
      piece.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
      celebrationLayer.appendChild(piece);
      (function (el) {
        el.addEventListener('animationend', function () { el.remove(); });
      })(piece);
    }
  }

  function spawnPawStamp() {
    const stamp = document.createElement('div');
    stamp.className = 'paw-stamp';
    stamp.innerHTML = svgPatinha(90);
    celebrationLayer.appendChild(stamp);
    stamp.addEventListener('animationend', function () { stamp.remove(); });
  }

  /* ------------------------------------------------------------
     BICHINHO — reações, pontos e acessórios
     ------------------------------------------------------------ */
  const mascotWrap = document.getElementById('mascotWrap');
  const heartLayer = document.getElementById('heartLayer');
  const pointsLabel = document.getElementById('pointsLabel');
  const progressFill = document.getElementById('progressFill');
  const progressHint = document.getElementById('progressHint');
  const accessoriesRow = document.getElementById('accessoriesRow');
  const unlockToast = document.getElementById('unlockToast');

  const REACTION_DURATIONS = { bounce: 700, wave: 800, fallback: 850, yawn: 900, stretch: 900, celebrate: 1000 };
  let reactionTimeout = null;

  function playMascotReaction(name) {
    Object.keys(REACTION_DURATIONS).forEach(function (r) { mascotWrap.classList.remove('anim-' + r); });
    void mascotWrap.offsetWidth; /* força reinício da animação */
    mascotWrap.classList.add('anim-' + name);
    clearTimeout(reactionTimeout);
    reactionTimeout = setTimeout(function () {
      mascotWrap.classList.remove('anim-' + name);
    }, REACTION_DURATIONS[name]);
  }

  mascotWrap.addEventListener('click', function () {
    const opcoes = ['bounce', 'wave', 'fallback', 'yawn', 'stretch'];
    const escolhida = opcoes[Math.floor(Math.random() * opcoes.length)];
    playMascotReaction(escolhida);
  });

  function spawnHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart-pop';
    heart.textContent = '💗';
    heartLayer.appendChild(heart);
    heart.addEventListener('animationend', function () { heart.remove(); });
  }

  /* -------- pontos e desbloqueio de acessórios -------- */
  function unlockedCount() {
    return Math.min(ACCESSORIES.length, Math.floor(data.points / PONTOS_POR_ACESSORIO));
  }

  function addPoints(delta) {
    const antes = unlockedCount();
    data.points = Math.max(0, data.points + delta);
    const depois = unlockedCount();
    saveData();
    updatePointsUI();

    if (depois > antes) {
      const novo = ACCESSORIES[depois - 1];
      showUnlockToast('🎉 Novo acessório: ' + novo.label + '!');
    }
  }

  function showUnlockToast(msg) {
    unlockToast.textContent = msg;
    unlockToast.classList.add('show');
    clearTimeout(showUnlockToast._t);
    showUnlockToast._t = setTimeout(function () {
      unlockToast.classList.remove('show');
    }, 2600);
  }

  function updatePointsUI() {
    pointsLabel.textContent = data.points;
    const un = unlockedCount();
    const progressoAtual = data.points % PONTOS_POR_ACESSORIO;
    const percent = un >= ACCESSORIES.length ? 100 : (progressoAtual / PONTOS_POR_ACESSORIO) * 100;
    progressFill.style.width = percent + '%';

    if (un >= ACCESSORIES.length) {
      progressHint.textContent = 'Todos os acessórios desbloqueados! 🏆';
    } else {
      progressHint.textContent = progressoAtual + '/' + PONTOS_POR_ACESSORIO + ' para "' + ACCESSORIES[un].label + '"';
    }

    renderAccessoriesRow();
    applyEquippedAccessories();
  }

  function renderAccessoriesRow() {
    accessoriesRow.innerHTML = '';
    const un = unlockedCount();
    ACCESSORIES.forEach(function (acc, idx) {
      const isUnlocked = idx < un;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'acc-badge' + (isUnlocked ? '' : ' locked') + (data.equipped[acc.id] ? ' equipped' : '');
      btn.title = isUnlocked ? acc.label : (acc.label + ' (bloqueado)');
      btn.innerHTML = ACC_ICON_SVG[acc.id];
      if (isUnlocked) {
        btn.addEventListener('click', function () {
          data.equipped[acc.id] = !data.equipped[acc.id];
          saveData();
          renderAccessoriesRow();
          applyEquippedAccessories();
        });
      }
      accessoriesRow.appendChild(btn);
    });
  }

  function applyEquippedAccessories() {
    ACCESSORIES.forEach(function (acc) {
      const el = document.getElementById('acc-' + acc.id);
      if (el) el.style.display = data.equipped[acc.id] ? 'inline' : 'none';
    });
  }

  /* ------------------------------------------------------------
     INICIALIZAÇÃO
     ------------------------------------------------------------ */
  renderCalendar();
  renderTasks();
  updatePointsUI();
})();
</script>
</body>
</html>
